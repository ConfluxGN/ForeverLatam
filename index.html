<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ForeverLatam</title>
<meta name="description" content="Streamers en el mapa: girá la Tierra y encontrá a cada uno.">
<!-- pide a los robots de IA que no usen el contenido ni las fotos para entrenar (Google sigue indexando la web) -->
<meta name="robots" content="noai, noimageai">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Noto+Color+Emoji&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="stylesheet" href="site.css?v=20261111l">
</head>
<body class="public" data-mode="public">
<div class="app">
  <header class="top">
    <div>
      <h1>Forever<b>Latam</b></h1>
      <p class="sum" id="sum">Cargando el listado…</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-add" type="button" hidden>+ Agregar streamer</button>
      <button class="btn" id="btn-hist" type="button" hidden>Historial</button>
      <button class="btn" id="btn-trash" type="button" hidden>Papelera <span class="badge" id="trash-n">0</span></button>
      <button class="btn" id="btn-event" type="button" hidden>Evento</button>
      <button class="btn" id="btn-banner" type="button" aria-pressed="true" hidden>Aviso: visible</button>
      <button class="btn" id="btn-bracket" type="button" aria-pressed="false" hidden>Bracket: oculto</button>
      <button class="btn" id="btn-export" type="button" hidden>Exportar copia</button>
      <button class="btn" id="btn-import" type="button" hidden>Importar copia</button>
      <button class="btn" id="btn-preview" type="button" hidden>Ver como visitante</button>
      <button class="btn" id="btn-logout" type="button" hidden>Salir</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>
  <main class="layout">
    <section class="stage" id="stage" aria-label="Globo terráqueo">
      <canvas id="globe-gl" aria-hidden="true"></canvas>
      <canvas id="globe"></canvas>
      <div class="stems" id="stems"></div>
      <div class="labels" id="labels"></div>
      <div class="loading" id="loading">Cargando mapa…</div>
      <div class="pickbar" id="pickbar" hidden><span>Tocá el globo donde vive</span><button type="button" id="pick-cancel">Cancelar</button></div>
      <div class="chip" id="chip">Vista: países</div>
      <button class="btn primary back" id="btn-back" type="button">Volver al panel</button>
      <aside class="ev-banner" id="ev-banner" aria-label="Evento de la comunidad" hidden>
        <button type="button" class="ev-banner-go" id="ev-banner-go">
          <span class="ev-banner-kick">Evento PvP · Solo No Muertos</span>
          <span class="ev-banner-title">El llamado de los Condenados</span>
          <span class="ev-banner-date">Domingo 15 de noviembre · 5 p. m.</span>
          <span class="ev-banner-txt">Primer torneo de duelos · Premios de 25, 15 y 10 USD</span>
          <span class="ev-banner-host">Presenta BrianfilthTV <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 3 7.5 6 4.5 9"/></svg></span>
        </button>
        <button type="button" class="ev-banner-x" id="ev-banner-x" aria-label="Cerrar aviso del evento"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
      </aside>
      <button type="button" class="bk-open" id="bk-open" hidden>Bracket Torneo</button>
      <div class="credit">Creado por PsychoMetal powered by AI</div>
      <div class="count" id="count" aria-live="polite"></div>
      <div class="zoom"><button type="button" id="zin" aria-label="Acercar">+</button><button type="button" id="zout" aria-label="Alejar">−</button></div>
    </section>
    <aside class="panel">
      <div class="panel-head">
        <h2>Listado</h2>
        <input class="search" id="q" type="search" placeholder="Buscar por nombre, país o provincia" aria-label="Buscar">
      </div>
      <ul class="roster" id="roster"></ul>
    </aside>
  </main>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="bk" id="bk" hidden><div class="bk-panel" id="bk-panel" role="dialog" aria-modal="true" aria-label="Bracket del torneo"></div></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button type="button" id="toast-btn"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script src="torneo.js?v=20261111l"></script>
<script src="site.js?v=20261111l"></script>
</body>
</html>
